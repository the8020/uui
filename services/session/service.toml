schema = 2
description = "Unified User Interface WebSocket sessions"
entrypoint = "service.ts"

[access]
mode = "authenticated"

[access.unauthenticated]
action = "reject"
status = 401
message = "Authentication is required."

[lifecycle]
default_enabled = true
service_type = "session"
session_keep_alive = "2m"

[scaling]
minimum_workers = 1
maximum_workers = 5000
concurrency_per_worker = 1
target_utilization = 0.70
worker_keep_alive = "2m"

[placement]
sandbox_group = "uui"
minimum_sandboxes = 1
workers_per_sandbox = 50
