schema = 2
description = "Unified User Interface WebSocket sessions"
entrypoint = "service.ts"

[access]
mode = "authenticated"

[access.unauthenticated]
action = "redirect"
redirect_url = "/the8020/uui/login/"
status = 302

[lifecycle]
default_enabled = true
service_type = "session"
session_keep_alive = "10m"

[scaling]
minimum_workers = 0
maximum_workers = 0
concurrency_per_worker = 1
target_utilization = 1.00
worker_keep_alive = "2m"

[placement]
sandbox_group = "uui"
minimum_sandboxes = 0
workers_per_sandbox = 64
