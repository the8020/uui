schema = 2
description = "Unified User Interface shell"
entrypoint = "service.ts"

[access]
mode = "authenticated"

[access.unauthenticated]
action = "redirect"
redirect_url = "/the8020/uui/login/"
status = 302

[lifecycle]
default_enabled = true
service_type = "stateless"
session_keep_alive = "10m"

[scaling]
minimum_workers = 1
maximum_workers = 8
concurrency_per_worker = 32
target_utilization = 0.70
worker_keep_alive = "2m"

[placement]
sandbox_group = "uui-shell"
minimum_sandboxes = 1
workers_per_sandbox = 2
