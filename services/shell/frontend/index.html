<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>80|20</title>
    <script nonce="__the8020_theme_nonce__">
    (() => {
      const readTheme = (storage, key) => {
        try {
          const value = storage.getItem(key);
          return value === "light" || value === "dark" ? value : null;
        } catch {
          return null;
        }
      };
      const theme = readTheme(
        sessionStorage,
        "the8020.uui.theme:initial",
      ) ?? readTheme(localStorage, "the8020.uui.theme") ??
        (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.dataset.theme = theme;
      window.__the8020InitialThemeApplied = {
        theme,
        at: performance.now(),
      };
    })();
    </script>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="markdown.css">
  </head>
  <body>
    <header class="navbar">
      <div class="container navbar-inner">
        <div class="navbar-leading">
          <div class="brand" aria-label="80|20 platform session">
            <span class="brand-gold" aria-hidden="true">80</span><span
              class="brand-pipe"
              aria-hidden="true"
            >|</span><span aria-hidden="true">20</span>
          </div>
          <button
            class="btn btn-ghost btn-sm screen-back"
            id="screen-back"
            type="button"
            aria-label="Back"
            title="Back"
            disabled
          >
          </button>
        </div>
        <div class="program-header" id="program-header" hidden>
          <div
            class="program-header-visible"
            id="program-header-visible"
          ></div>
          <details
            class="program-header-overflow"
            id="program-header-overflow"
            hidden
          >
            <summary
              class="btn btn-ghost btn-sm program-header-overflow-toggle"
              id="program-header-overflow-toggle"
              aria-label="More program controls"
              title="More program controls"
            ></summary>
            <div
              class="program-header-overflow-items"
              id="program-header-overflow-items"
              aria-label="Additional program controls"
            ></div>
          </details>
        </div>
        <nav class="navbar-actions" aria-label="Session controls">
          <details class="session-menu" id="session-menu">
            <summary
              class="btn btn-ghost btn-sm session-menu-toggle"
              id="session-menu-toggle"
              aria-controls="session-menu-panel"
              aria-expanded="false"
              aria-haspopup="true"
            >
              <span
                class="status-dot"
                id="connection-indicator"
                data-state="connecting"
                aria-hidden="true"
              ></span>
              <span class="session-username" id="session-username">User</span>
              <span class="session-menu-icon" id="session-menu-icon"></span>
              <span
                class="visually-hidden"
                id="connection-state"
                role="status"
                aria-live="polite"
              >Connecting…</span>
            </summary>
            <div
              class="session-menu-panel"
              id="session-menu-panel"
              aria-label="Session menu"
            >
              <button
                class="btn btn-ghost btn-sm session-menu-action messages-open"
                id="messages-open"
                type="button"
              >
                <span
                  class="message-count"
                  id="messages-count"
                  data-count="0"
                  aria-hidden="true"
                >0</span>
                <span class="session-menu-action-label">Messages</span>
              </button>
              <button
                class="btn btn-ghost btn-sm session-menu-action theme-toggle"
                id="theme-toggle"
                type="button"
                aria-pressed="true"
                aria-label="Switch to light mode"
              ></button>
              <button
                class="btn btn-ghost btn-sm session-menu-action session-logout"
                id="session-logout"
                type="button"
              ><span class="session-menu-action-label">Logout</span></button>
            </div>
          </details>
          <div
            class="message-toast-stack"
            id="message-toast-stack"
            aria-label="New messages"
            aria-live="polite"
            aria-relevant="additions"
            hidden
          >
            <button
              class="message-toast-dismiss-all"
              id="message-toast-dismiss-all"
              type="button"
              aria-label="Dismiss all message notifications"
              title="Dismiss all messages"
              hidden
            ></button>
          </div>
        </nav>
      </div>
    </header>
    <dialog
      class="uui-dialog uui-dialog-compact message-dialog"
      id="message-dialog"
      aria-labelledby="message-dialog-title"
    >
      <section class="uui-dialog-frame message-dialog-frame">
        <header class="uui-dialog-toolbar message-dialog-header">
          <h2 class="uui-dialog-title" id="message-dialog-title">Messages</h2>
          <button
            class="btn btn-ghost btn-sm uui-dialog-close message-dialog-close"
            id="message-dialog-close"
            type="button"
            aria-label="Close"
            title="Close"
          ></button>
        </header>
        <div
          class="uui-dialog-body message-history-list"
          id="message-history-list"
        ></div>
      </section>
    </dialog>
    <div id="notice" class="notice" role="alert" hidden></div>
    <div id="interaction-shield" class="interaction-shield" aria-hidden="true">
      <div class="interaction-indicator">
        <span class="interaction-spinner"></span>
        <span>Loading…</span>
      </div>
    </div>
    <main class="shell-main">
      <div class="container">
        <div id="app" aria-live="polite">
          <p class="loading">Opening your session…</p>
        </div>
      </div>
    </main>
    <div id="modal-layers"></div>
    <script id="the8020-boot" type="application/json">
    { "__the8020_boot_placeholder__": true }
    </script>
    <script type="module" src="main.js"></script>
  </body>
</html>
