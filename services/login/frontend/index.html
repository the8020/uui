<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>80|20 sign in</title>
    <link rel="stylesheet" href="styles.css">
    <script src="language.js" defer></script>
  </head>
  <body>
    <main class="login-card" aria-labelledby="login-title">
      <h1 class="group-title" id="login-title"
        data-i18n="login.signIn">{{ login.signIn }}</h1>
      <div class="brand" dir="ltr" aria-label="80|20">
        <span class="brand-gold" aria-hidden="true">80</span><span
          class="brand-pipe"
          aria-hidden="true"
        >|</span><span aria-hidden="true">20</span>
      </div>
      <!--__the8020_login_error__-->
      <form method="post" autocomplete="on">
        <label class="field">
          <span data-i18n="login.username">{{ login.username }}</span>
          <input name="username" autocomplete="username" required autofocus>
        </label>
        <label class="field">
          <span data-i18n="login.password">{{ login.password }}</span>
          <input
            name="password"
            type="password"
            autocomplete="current-password"
            required
          >
        </label>
        <label class="field">
          <span data-i18n="login.language">{{ login.language }}</span>
          <select name="language">__language_options__</select>
        </label>
        <button type="submit"
          data-i18n="login.signIn">{{ login.signIn }}</button>
      </form>
    </main>
  </body>
</html>
